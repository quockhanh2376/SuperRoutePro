[package]
name = "super-route-pro"
version = "10.1.7"
default-run = "SuperRoute"
description = "Super Route Pro - Network Routing Manager"
authors = ["Zonzon"]
edition = "2021"

[[bin]]
name = "SuperRoute"
path = "src/main.rs"

[[bin]]
name = "SuperRouteRepairBroker"
path = "src/repair_broker_main.rs"

[[bin]]
name = "SuperRouteService"
path = "src/route_service_main.rs"

[lib]
name = "super_route_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls", "stream"] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
